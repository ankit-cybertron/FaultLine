name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite & Build Verification
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Run Test Suite
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INVESTIGATOR_MODEL: llama-3.3-70b-versatile
          JUDGE_MODEL: llama-3.1-8b-instant
        run: |
          pytest tests/ -v

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="/home/${{ secrets.EC2_USER }}/faultline"

            echo "=== Deploying FaultLine to AWS EC2 ==="
            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "Updating code from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "Configuring environment..."
            cat << 'EOF' > .env
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            FALKORDB_HOST=falkordb
            FALKORDB_PORT=6379
            INVESTIGATOR_MODEL=llama-3.3-70b-versatile
            JUDGE_MODEL=llama-3.1-8b-instant
            EOF

            echo "Starting containers with Docker Compose..."
            docker compose down
            docker compose up -d --build

            echo "Deployment successful! Active containers:"
            docker compose ps
