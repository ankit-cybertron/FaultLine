[project]
name = "faultline"
version = "0.1.0"
description = "Agent failure forensics: backprop for agent failures via run graphs"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0.10",
    "fastapi>=0.111.0",
    "fastmcp>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "groq>=0.9.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-api>=1.25.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "diskcache>=5.6.3",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
faultline = "faultline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faultline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
